services:
  - type: web
    name: smarthr-backend
    runtime: node
    plan: free
    rootDir: Backend
    buildCommand: npm ci && npm run build && npm run migration:run
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DB_SSL
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: smarthr-postgres
          property: connectionString

  - type: web
    name: smarthr-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://smarthr-backend-gzm2.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: smarthr-postgres
    databaseName: smarthr_db
    user: smarthr_user
